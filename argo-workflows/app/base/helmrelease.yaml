apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
spec:
  interval: 1m
  timeout: 10m
  serviceAccountName: default-login-serviceaccount
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: argo-workflows
      version: "0.46.4"
      sourceRef:
        kind: HelmRepository
        name: argo
      interval: 5m
  values:
    fullnameOverride: argo-workflows
    crds:
      install: false
      keep: true
    singleNamespace: true
    createAggregateRoles: false
    workflow:
      serviceAccount:
        create: false
        name: argo-workflow
      rbac:
        create: false
    controller:
      podSecurityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      serviceAccount:
        create: false
        name: argo-workflows-workflow-controller
      rbac:
        create: false
      instanceID:
        enabled: true
        useReleaseName: false
        explicitID: argo-workflows
      clusterWorkflowTemplates:
        enabled: false
    mainContainer:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
    executor:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
    server:
      enabled: true
      podSecurityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      serviceAccount:
        create: false
        name: argo-workflows-server
      rbac:
        create: false
      clusterWorkflowTemplates:
        enabled: false
      serviceType: ClusterIP
      authModes:
        - server
