apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cx-argo-workflows-encore-ns
resources:
  - gitrepository.yaml
  - ../base/argo-workflows-rbac.yaml
  - ../base/argo-workflows.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./argo-workflows/app/overlays/test
    target:
      kind: Kustomization
      name: argo-workflows
replacements:
  - source:
      kind: GitRepository
      name: encore-apps-argo-workflows
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Kustomization
          name: argo-workflows-rbac-roles
        fieldPaths:
          - spec.targetNamespace
      - select:
          kind: Kustomization
          name: argo-workflows-rbac-bindings
        fieldPaths:
          - spec.targetNamespace
      - select:
          kind: Kustomization
          name: argo-workflows
        fieldPaths:
          - spec.targetNamespace
