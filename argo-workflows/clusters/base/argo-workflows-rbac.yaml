apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-rbac
spec:
  interval: 1m
  path: ./argo-workflows/app/rbac
  prune: true
  targetNamespace: placeholder
  serviceAccountName: default-login-serviceaccount
  sourceRef:
    kind: GitRepository
    name: encore-apps-argo-workflows
  wait: true
  timeout: 5m
