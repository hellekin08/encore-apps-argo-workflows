apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-rbac-roles
spec:
  interval: 1m
  path: ./argo-workflows/app/rbac/roles
  prune: true
  targetNamespace: placeholder
  serviceAccountName: default-login-serviceaccount
  sourceRef:
    kind: GitRepository
    name: encore-apps-argo-workflows
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows-rbac-bindings
spec:
  interval: 1m
  dependsOn:
    - name: argo-workflows-rbac-roles
  path: ./argo-workflows/app/rbac/bindings
  prune: true
  targetNamespace: placeholder
  serviceAccountName: default-login-serviceaccount
  sourceRef:
    kind: GitRepository
    name: encore-apps-argo-workflows
  wait: true
  timeout: 5m
