apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-workflows
spec:
  interval: 1m
  path: ./argo-workflows/app/overlays/dev
  prune: true
  targetNamespace: placeholder
  serviceAccountName: default-login-serviceaccount
  sourceRef:
    kind: GitRepository
    name: encore-apps-argo-workflows
  wait: false
  timeout: 15m
